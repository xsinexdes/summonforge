name: SummonForge
version: 0.1.0
main: com.summonforge.core.SummonForge
api-version: '1.21'
load: POSTWORLD
description: Invocaciones, bosses y poderes custom, todo por GUI
authors: [Kurjr]
softdepend: [BetterModel, Citizens, PlaceholderAPI, Vault, WorldGuard, FastAsyncWorldEdit, WorldEdit]
commands:
  invocaciones:
    description: Menú maestro y comandos de SummonForge
    aliases: [inv, summon, sf]
    usage: /<command> [menu|yo|invocar|despedir|habilidad|ejemplos|dar|boss|spawn|probar|modelos|reload]
permissions:
  summonforge.admin:
    description: Administración completa de SummonForge
    default: op
    children:
      summonforge.use: true
  summonforge.use:
    description: Usar invocaciones propias
    default: true
