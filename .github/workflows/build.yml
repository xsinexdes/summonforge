name: Build SummonForge

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar
        run: mvn -B clean package
      - name: Subir jar
        uses: actions/upload-artifact@v4
        with:
          name: SummonForge
          path: target/SummonForge-*.jar
